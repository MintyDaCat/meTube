<!DOCTYPE html>
<html>
    <head>
        <title>
            MeTube
        </title>

        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="guide-panel" id="guide-panel">
            <button>Home</button>
            <button>shorts</button>
        </div>

        <div id="popup" class="pop-up">

        </div>
        
        <div class="main">
            <div class="top-bar">
                <div class="guide-button" role="button" id="guide-button">
                    <p> = </p>
                </div>

                <div id="icon" class="icon" role="button">
                    <h1>MeTube</h1>
                </div>

                <div class="search-bar">
                    <input type="text">
                </div>

                <div class="buttons">
                    <div id="Upload-button" role="button">
                        <p>Upload</p>
                    </div>
                </div>

                <div id="profile" role="button">
                    <img src="" alt="" id="profile-image">
                    
                </div>
                <div id="profileDropdownMenu" class="profile-dropdown-card">
                    <div class="profile-dropdown-card__user-info">
                        <span id="dropdownUserNumber">Guest Account</span>
                    </div>
                    <hr class="profile-dropdown-card__divider">
                    <ul class="profile-dropdown-card__list">
                        <li id="dropdownLoginItem" class="profile-dropdown-card__item">🔑 Sign In / Register</li>
                        <li id="dropdownSettingsItem" class="profile-dropdown-card__item">⚙️ Platform Settings</li>
                        <li id="dropdownLogoutItem" class="profile-dropdown-card__item profile-dropdown-card__item--danger">🚪 Sign Out
                        </li>
                    </ul>
                </div>
            </div>

            <div class="screen active" id="home-page">

                <div id="video-grid-wrapper"></div>
            </div>

            <div class="screen" id="video-player">
                <div class="video-main">
                    <div class="video-display">
                        <video id="player" controls width="100%" poster="" class="player">
                            <source id="video-source" src="">
                        </video>
                    </div>
                    <div class="video-info" id="video-info">
                        <p id="video-player-title">title</p>
                        <p1 id="video-player-description"></p1>
                        <div>
                            <p2 id="expand-desc">see more...</p2>
                        </div>
                    </div>
                    <div id="comments">
                        <p>Comments</p>
                        <div>

                        </div>
                    </div>
                </div>
                

                <div id="featured">
                    
                </div>
            </div>

            <div class="screen" id="shorts-viewer">

            </div>
        </div>
        
        
    </body>

    <script type="module" src="script.js" defer></script>
</html>
